# =============================================================================
# XiaoMan Mall — Nginx production site
#
# WHAT THIS FILE IS
#   A self-contained Nginx server configuration for the XiaoMan Mall Node.js
#   application. It terminates TLS, redirects HTTP to HTTPS, reverse-proxies
#   the app on 127.0.0.1:3000, and keeps Server-Sent Events unbuffered.
#
# 这个文件是干什么的
#   小满商城的 Nginx 站点配置：80 跳 443、TLS、反向代理、SSE 不缓冲、
#   静态资源缓存、gzip、安全响应头、1 MB 请求体上限。
#
# 用法
#   1. 把 mall.example.com 全部替换成自己的正式域名（server_name 和证书路径）。
#   2. 放到 /etc/nginx/sites-available/xiaoman-mall.conf，软链到 sites-enabled。
#   3. 先 nginx -t，通过后再 reload；证书不存在时先按 docs 用 certbot 申请。
#
# 注意
#   - 本文件假设它被 include 在 nginx.conf 的 http {} 里（sites-enabled 就是这种用法）。
#   - 后端当前监听 127.0.0.1:3000；如果改了 PORT，同步改 upstream。
#   - 只负责 HTTPS 站点；HTTP 站点另有 server 块，专门做跳转和 ACME 验证。
# =============================================================================

# 访问日志多记两个时间：rt=总耗时，urt=后端耗时。排 502/504 时先看这两个值。
log_format xiaoman_mall '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time';

upstream xiaoman_mall {
    # 后端只监听本机回环地址，不直接暴露公网。
    server 127.0.0.1:3000;

    # 与后端的 keep-alive 连接池；配合下面每个 location 的 proxy_http_version 1.1
    # 和 proxy_set_header Connection "" 才会生效。
    keepalive 32;
    keepalive_requests 1000;
}

# -----------------------------------------------------------------------------
# HTTP :80 —— 只做两件事：ACME 验证、其余 301 到 HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mall.example.com;

    access_log /var/log/nginx/xiaoman-mall.access.log xiaoman_mall;
    error_log  /var/log/nginx/xiaoman-mall.error.log warn;

    # certbot --webroot 会把验证文件写进 /var/www/certbot；
    # 这个 location 必须在 301 之前匹配，否则续期会被跳转打断。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443 —— TLS 终止 + 反向代理
# -----------------------------------------------------------------------------
server {
    # nginx >= 1.25.1 会提示 listen ... http2 已弃用，可改成：
    #   listen 443 ssl;
    #   http2 on;
    # 为了兼容 Ubuntu 22.04/24.04 自带的 nginx，这里仍用兼容写法。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mall.example.com;

    # 证书由 certbot 签发后放在这里；域名换了，这三处路径都要改。
    ssl_certificate     /etc/letsencrypt/live/mall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mall.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # 与后端 router 的 1 MB 上限保持一致；超过时 Nginx 返回 413（HTML），
    # 不会走到后端返回 JSON 41301。
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    access_log /var/log/nginx/xiaoman-mall.access.log xiaoman_mall;
    error_log  /var/log/nginx/xiaoman-mall.error.log warn;

    # -------------------------------------------------------------------------
    # 安全响应头
    # -------------------------------------------------------------------------
    # 说明：后端新版本也会发 X-Content-Type-Options / X-Frame-Options /
    # Referrer-Policy / Permissions-Policy。这里统一由 Nginx 发，再用下面的
    # proxy_hide_header 把后端同名头藏掉，避免响应里出现两份。
    #
    # HSTS 第一次上线建议先注释；确认 HTTPS、证书续期都正常后再打开。
    # 没有加 includeSubDomains，等所有子域都上了 HTTPS 再加。
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # CSP 说明：
    # - 页面没有内联 <script>，所以 script-src 只给 'self'；
    # - 但前端 JS 会生成少量 style="..." 的属性，style-src 需要 'unsafe-inline'，
    #   等这些内联样式改成 class 后可以去掉；
    # - 商品封面是 /assets/ 下的 SVG，同源，不需要额外白名单；
    # - 如果上线后控制台报 CSP，先注释这一行，按报错逐项收紧，不要直接放开 *。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # 后端同名头不再透传，避免重复；后端自己的 X-Request-Id / COOP 保留。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # -------------------------------------------------------------------------
    # SSE：AI 助手对话流
    # -------------------------------------------------------------------------
    # 必须用 = 精确匹配，避免 /api/agent/chat 被下面的普通 /api/ 规则吃掉。
    # 后端本身已经返回 Content-Type: text/event-stream、Cache-Control: no-cache,
    # no-transform 和 X-Accel-Buffering: no；这里再显式关一次，便于排查和兜底。
    location = /api/agent/chat {
        proxy_pass http://xiaoman_mall;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # 这三行是 SSE 不“攒一波再发”的关键。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # SSE 是文本事件流，压缩会让浏览器/中间层拿不到逐条事件。
        gzip off;

        # 后端已发 X-Accel-Buffering: no；先藏掉再补一条，避免出现两份。
        # 这里显式重复四个安全头的 hide，避免依赖 location 级 proxy_hide_header
        # 对 server 级配置的继承规则（不同 Nginx 版本的数组合并行为容易看漏）。
        proxy_hide_header X-Accel-Buffering;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        add_header X-Accel-Buffering no always;

        # 重点：location 里一旦出现 add_header，server 级 add_header 就不再继承，
        # 所以这里把安全头再写一遍。改 server 级安全头时记得同步这里。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # -------------------------------------------------------------------------
    # 普通 API
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://xiaoman_mall;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端靠这个头判断是不是 HTTPS，从而决定 Cookie 是否加 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering on;
    }

    # -------------------------------------------------------------------------
    # 静态资源：public 由 Node 提供，这里只加缓存头
    # -------------------------------------------------------------------------
    # 文件名没有内容 hash，所以先给 1h 这种保守值；要上 30d，先做文件名版本化。
    # 这个 location 没有 add_header，因此 server 级安全头会正常继承。
    location ~* ^/(assets|css|js)/ {
        proxy_pass http://xiaoman_mall;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # Node 自己会给 max-age=300；这里覆盖成 1h，并去掉上游的重复头。
        # 同样显式挡住后端四个安全头，确保本 location 只保留 server 级那一份。
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        expires 1h;

        proxy_read_timeout 30s;
        access_log off;
    }

    # 可选：让 Nginx 直接读 public/assets，绕过 Node（图片多时更省 CPU）。
    # 启用前先解决权限：本方案默认代码是 root:xiaoman、750/640，
    # Nginx worker（通常是 www-data）读不到；要么给 public/assets 加 o+rX，
    # 要么把 www-data 加进 xiaoman 组。启用后 /assets/ 的缓存由下面控制。
    # 注意：^~ 前缀匹配优先级高于上面的正则 location。
    #
    # location ^~ /assets/ {
    #     alias /opt/xiaoman-mall/xiaoman-mall/public/assets/;
    #     expires 30d;
    #     access_log off;
    # }

    # -------------------------------------------------------------------------
    # 页面与其余静态文件：全部交给 Node
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://xiaoman_mall;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # gzip
    # -------------------------------------------------------------------------
    # 不要加 text/event-stream：SSE 一旦被压缩，逐条事件就可能被缓冲。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;
}