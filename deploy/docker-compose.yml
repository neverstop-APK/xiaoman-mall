# =============================================================================
# XiaoMan Mall — optional Docker Compose deployment
#
# WHAT THIS FILE IS
#   A single-service Compose file for running the XiaoMan Mall image behind a
#   host-level Nginx. It binds the app to 127.0.0.1:3000, persists JSON data in
#   a named volume, and runs the container read-only with all capabilities dropped.
#
# 这个文件是干什么的
#   小满商城的可选 Docker Compose 方案：构建/启动一个非 root 容器，
#   只监听本机 3000 端口，数据放命名卷，容器根文件系统只读。
#
# 用法（在仓库根目录）
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml logs -f --tail=100
#
# 注意
#   - 这是可选的第二种部署方式；已经用 systemd 直装时不要同时起这个，
#     否则 3000 端口会冲突。
#   - AGENT_API_KEY 不要写进本文件，也不要在 deploy/ 下建会被提交的 .env。
#     推荐：export AGENT_API_KEY=... 后再 up，或用 --env-file /etc/xiaoman-mall.env。
#   - 容器监听 0.0.0.0:3000，但只映射到宿主机 127.0.0.1:3000，公网仍由 Nginx 进入。
# =============================================================================

name: xiaoman-mall

services:
  mall:
    build:
      # 构建上下文是仓库根，Dockerfile 在 deploy/ 下。
      context: ..
      dockerfile: deploy/Dockerfile
    image: xiaoman-mall:1.0.0
    container_name: xiaoman-mall
    restart: unless-stopped

    # 只绑回环地址；Nginx 在宿主机上反代到 127.0.0.1:3000。
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      # 容器内必须监听 0.0.0.0，否则宿主机端口映射进不来。
      HOST: 0.0.0.0
      PORT: "3000"
      XM_DATA_DIR: /app/data
      XM_TRACE_FILE: /app/data/agent-traces.jsonl
      # 下面几项从宿主机环境读取；没设置时用默认值。
      AGENT_MODE: "${AGENT_MODE:-local}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      AGENT_BASE_URL: "${AGENT_BASE_URL:-https://api.deepseek.com/v1}"
      AGENT_MODEL: "${AGENT_MODEL:-deepseek-chat}"
      AGENT_TIMEOUT_MS: "${AGENT_TIMEOUT_MS:-30000}"

    volumes:
      # 商品/分类首次启动时由镜像里的种子文件提供；之后所有 JSON 都写在这个卷。
      - mall-data:/app/data

    # 容器根文件系统只读，减少被写入 webshell/临时文件的风险。
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

    healthcheck:
      # 不依赖 curl/wget；Node 22 自带 fetch。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 给 Node 的优雅退出留时间（应用内部最多等 5 秒）。
    stop_grace_period: 15s

volumes:
  mall-data:
    # 固定卷名，docker compose down 不会误删；要删数据用 docker volume rm。
    name: xiaoman-mall-data