<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="砚白 手作陶瓷马克杯">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ece2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="555" cy="175" r="150" fill="#efd3bb" opacity="0.75" filter="url(#soft)"/>
  <circle cx="159" cy="476" r="190" fill="#efd3bb" opacity="0.45" filter="url(#soft)"/>

  <circle cx="400" cy="300" r="210" fill="#ffffff" opacity="0.38"/>

  <g transform="rotate(7.5 400 300)">
    <text x="400" y="366" text-anchor="middle" font-size="220" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">☕</text>
  </g>
</svg>
