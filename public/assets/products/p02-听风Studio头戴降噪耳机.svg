  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="639" cy="147" r="150" fill="#c3d3f5" opacity="0.75" filter="url(#soft)"/>
  <circle cx="97" cy="410" r="190" fill="#c3d3f5" opacity="0.45" filter="url(#soft)"/>

  <circle cx="400" cy="300" r="210" fill="#ffffff" opacity="0.38"/>

  <g transform="rotate(-1.1 400 300)">
    <text x="400" y="366" text-anchor="middle" font-size="220" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🎧</text>
