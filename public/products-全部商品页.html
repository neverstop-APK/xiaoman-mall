<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全部商品 · 小满商城</title>
  <meta name="description" content="小满商城的完整商品目录：关键词搜索、分类、价格区间、五种排序与分页，筛选条件会写进地址栏。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22%23c2542b%22/></svg>">
  <link rel="stylesheet" href="./css/base-设计变量与基础样式.css">
  <link rel="stylesheet" href="./css/layout-导航与页面布局.css">
  <link rel="stylesheet" href="./css/components-通用组件样式.css">
  <link rel="stylesheet" href="./css/pages-各页面专属样式.css">
  <link rel="stylesheet" href="./css/extra-结算与补充样式.css">
  <link rel="stylesheet" href="./css/auth-登录与账号样式.css">
  <link rel="stylesheet" href="./css/agent-购物助手样式.css">
  <link rel="stylesheet" href="./css/catalog-全部商品页样式.css">
</head>
<body>
  <!-- ===== 顶部导航：与首页共用一套结构 ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index-首页.html" aria-label="小满商城首页">
        <span class="brand-dot" aria-hidden="true"></span>小满
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="icon-btn nav-link" href="./index-首页.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
          <span class="icon-label">首页</span>
        </a>
        <a class="icon-btn nav-link" href="./products-全部商品页.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
          <span class="icon-label">全部商品</span>
        </a>
        <a class="icon-btn nav-link" href="./orders-我的订单页.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>
          <span class="icon-label">我的订单</span>
        </a>
      </nav>

      <form class="header-search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="searchInput" type="search" name="keyword" placeholder="搜耳机、键盘、杯子…" autocomplete="off" aria-label="搜索商品">
        <button class="btn btn-primary" type="submit" style="padding:0.35em 0.9em">搜索</button>
      </form>

      <div class="header-actions">
        <button class="icon-btn" id="cartOpenBtn" type="button" aria-label="打开购物车" aria-controls="cartDrawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          <span class="icon-label">购物车</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
        <button class="icon-btn" id="accountBtn" type="button" aria-haspopup="menu" aria-label="登录或注册">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="icon-label" id="accountLabel">登录</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== 页头：说明这一页负责完整目录，首页只负责推荐 ===== -->
    <section class="container catalog-hero">
      <p class="eyebrow">All products</p>
      <h1 class="h1 catalog-title">全部商品</h1>
    </section>

    <!-- ===== 搜索 / 筛选 / 排序 / 分页 ===== -->
    <section class="section catalog-section" id="list">
      <div class="container">
        <div class="filter-bar catalog-filter-bar">
          <div class="chip-group" id="categoryChips" role="group" aria-label="按分类筛选"></div>
          <span class="filter-spacer"></span>
          <div class="chip-group" id="priceChips" role="group" aria-label="按价格筛选"></div>
          <select class="select filter-select" id="sortSelect" aria-label="排序方式">
            <option value="default">综合排序</option>
            <option value="price-asc">价格从低到高</option>
            <option value="price-desc">价格从高到低</option>
            <option value="sales-desc">销量优先</option>
            <option value="rating-desc">评分优先</option>
            <option value="newest">最新上架</option>
          </select>
        </div>

        <div class="search-hint" id="searchHint" hidden></div>

        <div class="catalog-meta">
          <div class="filter-result" id="resultCount" aria-live="polite"></div>
          <a class="catalog-back" href="./index-首页.html">← 回首页看看推荐</a>
        </div>

        <div class="product-grid" id="productGrid" aria-busy="true"></div>

        <div class="empty" id="emptyState" hidden>
          <span class="empty-emoji" aria-hidden="true">🔍</span>
          <span class="empty-title">没有找到符合条件的商品</span>
          <span class="text-sm">换个关键词，或者把价格区间放宽一点试试。</span>
          <button class="btn btn-ghost" id="resetFilterBtn" type="button">清除全部筛选</button>
        </div>

        <nav class="pagination" id="pagination" aria-label="分页"></nav>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="brand" href="./index-首页.html"><span class="brand-dot" aria-hidden="true"></span>小满</a>
      </div>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="./index-首页.html#categories">商品分类</a>
        <a href="./products-全部商品页.html">全部商品</a>
        <a href="./orders-我的订单页.html">我的订单</a>
        <a href="./404-页面不存在.html">404 示例</a>
      </nav>
    </div>
  </footer>

  <!-- ===== 侧拉购物车 ===== -->
  <div class="drawer-mask" id="cartMask" aria-hidden="true"></div>
  <aside class="drawer" id="cartDrawer" aria-hidden="true" aria-label="购物车" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <h2 class="drawer-title">购物车 <span class="count" id="cartCount">0 件</span></h2>
      <button class="icon-btn" id="cartCloseBtn" type="button" aria-label="关闭购物车">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <ul id="cartItems" class="drawer-body" style="padding:0;gap:0.75rem"></ul>
      <div class="empty" id="cartEmpty" hidden>
        <span class="empty-emoji" aria-hidden="true">🛒</span>
        <span class="empty-title">购物车还是空的</span>
        <span class="text-sm">去挑一件顺手的吧，满 99 元包邮</span>
        <a class="btn btn-ghost" href="./products-全部商品页.html">去逛逛</a>
      </div>
    </div>

    <div class="drawer-foot" id="cartFooter" hidden>
      <div class="shipping-hint" id="cartShippingHint" aria-live="polite"></div>
      <div class="total-row">
        <span class="label">合计（不含运费）</span>
        <span class="amount" id="cartTotal">¥0.00</span>
      </div>
      <div class="drawer-actions">
        <button class="btn btn-ghost" id="cartClearBtn" type="button">清空</button>
        <button class="btn btn-primary btn-lg" id="cartCheckoutBtn" type="button">去结算</button>
      </div>
    </div>
  </aside>

  <!-- ===== 结算弹窗 ===== -->
  <div class="modal-wrap" id="checkoutModal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 class="h3" id="checkoutTitle">确认订单</h2>
        <button class="icon-btn" id="checkoutCloseBtn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <form id="checkoutForm" novalidate>
        <div class="modal-body">
          <div class="form-grid">
            <label class="field">
              <span class="field-label">收货人</span>
              <input class="input" id="receiverName" maxlength="12" value="王小满" required>
            </label>
            <label class="field">
              <span class="field-label">手机号</span>
              <input class="input" id="receiverPhone" inputmode="numeric" maxlength="11" value="13800001234" required>
            </label>
          </div>
          <label class="field">
            <span class="field-label">收货地址</span>
            <input class="input" id="receiverAddress" value="浙江省杭州市西湖区 小满路 1 号 3 幢 201" required>
          </label>
          <label class="field">
            <span class="field-label">备注（选填）</span>
            <input class="input" id="orderRemark" maxlength="40" placeholder="例如：工作日送货 / 放门口">
          </label>

          <div class="checkout-box">
            <div class="line"><span>商品件数</span><span><strong id="checkoutCount">0</strong> 件</span></div>
            <div class="line"><span>商品金额</span><span id="checkoutAmount">¥0.00</span></div>
            <div class="line total"><span>应付金额</span><span class="amount" id="checkoutPayable">¥0.00</span></div>
            <p class="text-xs text-muted">满 99 元包邮，否则运费 ¥12.00（运费在服务端计算）</p>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" type="button" data-close-checkout>再想想</button>
          <button class="btn btn-primary" id="checkoutSubmit" type="submit">提交订单并支付</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script type="module" src="./js/products-全部商品页逻辑.js"></script>
</body>
</html>
