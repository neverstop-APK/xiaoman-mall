<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的订单 · 小满商城</title>
  <meta name="description" content="小满商城订单结果页：订单编号、商品信息、数量、单价、总价、创建时间与订单状态。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22%23c2542b%22/></svg>">
  <link rel="stylesheet" href="./css/base-设计变量与基础样式.css">
  <link rel="stylesheet" href="./css/layout-导航与页面布局.css">
  <link rel="stylesheet" href="./css/components-通用组件样式.css">
  <link rel="stylesheet" href="./css/pages-各页面专属样式.css">
  <link rel="stylesheet" href="./css/extra-结算与补充样式.css">
  <link rel="stylesheet" href="./css/auth-登录与账号样式.css">
  <link rel="stylesheet" href="./css/agent-购物助手样式.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index-首页.html" aria-label="小满商城首页">
        <span class="brand-dot" aria-hidden="true"></span>小满
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="icon-btn nav-link" href="./index-首页.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
          <span class="icon-label">首页</span>
        </a>
        <a class="icon-btn nav-link" href="./products-全部商品页.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
          <span class="icon-label">全部商品</span>
        </a>
        <a class="icon-btn nav-link" href="./orders-我的订单页.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>
          <span class="icon-label">我的订单</span>
        </a>
      </nav>
      <form class="header-search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="searchInput" type="search" name="keyword" placeholder="搜耳机、键盘、杯子…" autocomplete="off" aria-label="搜索商品">
        <button class="btn btn-primary" type="submit" style="padding:0.35em 0.9em">搜索</button>
      </form>
      <div class="header-actions">
        <button class="icon-btn" id="cartOpenBtn" type="button" aria-label="打开购物车" aria-controls="cartDrawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          <span class="icon-label">购物车</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
        <button class="icon-btn" id="accountBtn" type="button" aria-haspopup="menu" aria-label="登录或注册">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="icon-label" id="accountLabel">登录</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="orders-list-head">
      <div>
        <p class="eyebrow">Orders</p>
        <h1 class="h1">我的订单</h1>
      </div>
      <a class="btn btn-ghost" href="./products-全部商品页.html">继续逛逛</a>
    </div>

    <!-- 查询：两种方式——输入订单号，或从下面的"最近订单"直接点开 -->
    <form class="order-search" id="orderSearchForm" role="search">
      <input class="input" id="orderSearchInput" type="search" placeholder="输入订单号，例如 XM20261021A1B2C3" autocomplete="off" aria-label="订单号">
      <button class="btn btn-primary" type="submit">查订单</button>
    </form>

    <!-- ?id=xxx 时，这一块显示单个订单的完整结果 -->
    <div id="orderResult"></div>

    <!-- 没有 ?id= 时，这一块显示本机下过的订单 -->
    <section id="orderHistorySection" hidden>
      <div class="orders-list-head">
        <h2 class="h3">最近订单</h2>
        <span class="text-sm text-muted" id="ordersCount"></span>
      </div>
      <div id="ordersList"></div>
    </section>
  </main>

  <!-- include: footer -->
  <div class="drawer-mask" id="cartMask" aria-hidden="true"></div>
  <!-- include: cartdrawer -->
  <!-- include: checkout -->

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script type="module" src="./js/orders-订单页逻辑.js"></script>
</body>
</html>
